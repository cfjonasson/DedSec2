<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DedSec Interface</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar card">
      <h1 class="glitch" data-text="DedSec Console">DedSec Console</h1>
      <p class="subtitle">Watch Dogs 2 inspired UI — clean, sharp, and professional.</p>
    </header>

    <section class="card">
      <h2>System Access</h2>
      <div class="form-grid">
        <label>
          Username
          <input type="text" placeholder="Enter handle" />
        </label>

        <label>
          Access Key
          <input type="password" placeholder="••••••••" />
        </label>
      </div>

      <div class="actions">
        <button class="btn">Authorize</button>
        <button class="btn secondary">Scan Network</button>
      </div>
    </section>

    <section class="card">
      <h2>Activity Feed</h2>
      <ul class="feed">
        <li>Node sync complete. Latency stable.</li>
        <li>Firewall route remapped.</li>
        <li>Encrypted channel active.</li>
      </ul>
      <a href="#">View full diagnostics →</a>
    </section>
  </main>
</body>
</html>
